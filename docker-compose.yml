services:
  postgres:
    image: postgres:17
    container_name: monitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: monitor_uptime
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: monitor-redis
    restart: unless-stopped
    ports:
      # BullMQ connects to localhost:6123 from the Node.js process.
      - "6123:6379"

volumes:
  postgres_data:
